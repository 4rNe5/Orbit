name: Sync wiki data

# Weekly: pull song info and missing jackets from wiki.rotaeno.cn and open a PR.
on:
  schedule:
    - cron: "17 3 * * 1" # Monday 12:17 KST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The wiki host drops TLS from GitHub runners; go through the wiki-proxy Edge Function.
      - run: node scripts/sync-wiki.mjs --report "$RUNNER_TEMP/sync-report.md"
        env:
          WIKI_PROXY: ${{ vars.WIKI_PROXY || 'https://ysezajjmchhwzzzcwckt.supabase.co/functions/v1/wiki-proxy' }}
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/sync-wiki
          delete-branch: true
          commit-message: "chore: 위키 곡 정보·자켓 동기화"
          title: "chore: 위키 곡 정보·자켓 동기화"
          body-path: ${{ runner.temp }}/sync-report.md
          add-paths: |
            src/data/songinfo.json
            src/data/jackets.json
            public/jackets/**
